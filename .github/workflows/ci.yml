name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m py_compile weather.py

      - name: CLI smoke test
        run: python weather.py --help

      # Live fetch is non-blocking: weather.com.cn may be unreachable from
      # GitHub-hosted runners, so a failure here shouldn't fail the build.
      - name: Live fetch (non-blocking)
        run: python weather.py
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t my-weather .
